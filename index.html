<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home – Inkwell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/app.js" defer></script>
</head>
<body data-page="home">
<main>
<section class="hero"><h1>Write what you know. Read what others know.</h1><p>Inkwell is a small place for short, honest posts on technology, travel, food and everyday learning.</p></section>
<div class="tools"><input id="q" type="search" placeholder="Search posts" aria-label="Search posts"><select id="cat" aria-label="Filter by category"></select></div>
<div id="grid" class="grid"></div>
<dialog id="reader"><h2 id="rt"></h2><p class="meta" id="rm"></p><div class="text" id="rb"></div><p><button class="btn ghost" id="close">Close</button></p></dialog>
</main>
</body>
</html>
