<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Write a post – Inkwell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/app.js" defer></script>
</head>
<body data-page="create">
<main>
<div class="panel" style="max-width:760px;margin:0 auto"><h1 id="h">Write a post</h1><form id="f" novalidate><label for="title">Title</label><input id="title" maxlength="120" required><label for="cat">Category</label><select id="cat"></select><label for="body">Your story</label><textarea id="body" required></textarea><p class="err" id="err" role="alert"></p><button class="btn" type="submit">Publish post</button> <a class="btn ghost" href="dashboard.html">Cancel</a></form></div>
</main>
</body>
</html>
