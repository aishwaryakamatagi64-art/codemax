<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register – Inkwell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/app.js" defer></script>
</head>
<body data-page="register">
<main>
<div class="panel narrow"><h1>Create your account</h1><form id="f" novalidate><label for="name">Full name</label><input id="name" required autocomplete="name"><label for="email">Email</label><input id="email" type="email" required autocomplete="email"><label for="pw">Password</label><input id="pw" type="password" required autocomplete="new-password"><label for="pw2">Confirm password</label><input id="pw2" type="password" required autocomplete="new-password"><p class="err" id="err" role="alert"></p><button class="btn" type="submit">Create account</button></form><p class="meta">Already registered? <a href="login.html">Log in</a></p></div>
</main>
</body>
</html>
